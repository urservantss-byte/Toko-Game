app = "toko-game"
primary_region = "sin"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "toko_data"
  destination = "/data"

[env]
  DB_PATH = "/data/toko.db"
  UPLOAD_PATH = "/data/uploads"
