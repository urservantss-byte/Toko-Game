<title>TokoGame — Akun, Voucher & Topup Digital</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
if (typeof tailwind !== 'undefined') tailwind.config = { darkMode: 'class', theme: { extend: { colors: {
  primary: '#4f46e5',
  accent: '#f59e0b',
  // NOVA design system (2026-10-04) — clean & unik
  nova: {
    bg: '#0a0e1a',       // background utama
    surface: '#131a30',  // kartu
    surface2: '#1a2340', // elevated
    line: '#232c4d',     // border
    accent: '#6c7cff',   // aksen signature periwinkle
    accentdim: '#4a56c8',
    gold: '#ffc24b',     // harga
    text: '#e8ecf8',     // teks utama
    muted: '#8b94b8',    // teks sekunder
  },
} } } };
// Terapkan tema sebelum render (hindari kedip)
try {
  const t = localStorage.getItem('tg_theme');
  if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
} catch (e) {}
function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('tg_theme', dark ? 'dark' : 'light'); } catch (e) {}
  return dark;
}
</script>
